<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Launcher de Sites</title>
    <link rel="stylesheet" href="style.css">
      <link rel="icon" type="image/png" href="favicon/icoLaunger.jpg">
    
       
</head>
<body>

    <div class="launcher-container">
        <h1>Launcher de Sites</h1>
        
        <div class="grid-sites">
            
            <!-- Item de Exemplo 1: Repita esta estrutura para novos sites -->
            <div class="card-site">
                <img src="favicon/Athens.ico" alt="Ícone do Sistema de Simulados Inteligente (Athens)" class="icone-site">
                <div class="nome-site">Sistema de Simulados Inteligente (Athens)</div>
                <div class="url-site">https://gustavo72737373737.github.io/Sistema-de-Simulados-Inteligente-Athens-Frontend/</div>
                <button class="btn-rodar" data-url="https://gustavo72737373737.github.io/Sistema-de-Simulados-Inteligente-Athens-Frontend/">Rodar</button>
            </div>

            <!-- Item de Exemplo 2 -->
            <div class="card-site">
                <img src="favicon/favicon_flashCardStatic/flashcardLogo.png" alt="Ícone staticFlash" class="icone-site">
                <div class="nome-site">staticFlash</div>
                <div class="url-site">https://gustavo72737373737.github.io/staticFlash/</div>
                <button class="btn-rodar" data-url="https://gustavo72737373737.github.io/staticFlash/">Rodar</button>
            </div>

            <!-- Item de Exemplo 3 -->
            <div class="card-site">
                <img src="https://placeholder.com" alt="Ícone Site 3" class="icone-site">
                <div class="nome-site">Em Desenvolvimento</div>
                <div class="url-site">https://link-do-site3.com</div>
                <button class="btn-rodar" data-url="https://link-do-site3.com">Rodar</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
